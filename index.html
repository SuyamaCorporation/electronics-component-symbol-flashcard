<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electronics Component Symbol Flashcard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: #0d1117; }
.card-container { perspective: 1200px; }
.card-inner {
  position: relative;
  width: 100%;
  height: 260px;
  transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
  transform-style: preserve-3d;
  cursor: pointer;
}
.card-inner.flipped { transform: rotateY(180deg); }
.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  border: 1px solid #21262d;
}
.card-front { background: #161b22; }
.card-back { background: #0d1117; border-color: #30363d; transform: rotateY(180deg); }
svg.symbol { background: transparent; }
.choice-btn { transition: all 0.15s; }
.choice-btn:hover { transform: scale(1.01); }
.choice-btn.correct { background: #14532d !important; border-color: #16a34a !important; }
.choice-btn.wrong { background: #450a0a !important; border-color: #dc2626 !important; }
</style>
</head>
<body class="text-gray-100 min-h-screen p-4">
<div class="max-w-3xl mx-auto">
  <h1 class="text-3xl font-bold text-center mb-1 text-cyan-400">Electronics Symbol Flashcard</h1>
  <p class="text-center text-gray-500 mb-4 text-sm">IEC · ANSI · Passive · Active · Logic · Power</p>

  <!-- Stats bar -->
  <div class="bg-gray-900 rounded-xl p-3 mb-4 flex items-center gap-4 text-sm">
    <div class="text-center"><span id="statCorrect" class="text-green-400 font-bold">0</span><span class="text-gray-600 text-xs ml-1">correct</span></div>
    <div class="text-center"><span id="statWrong" class="text-red-400 font-bold">0</span><span class="text-gray-600 text-xs ml-1">wrong</span></div>
    <div class="text-center"><span id="statMastered" class="text-cyan-400 font-bold">0</span><span class="text-gray-600 text-xs ml-1">mastered</span></div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-2">
      <label class="text-xs text-gray-500" for="stdToggle">Standard:</label>
      <button id="stdToggle" onclick="toggleStandard()" class="bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1 rounded-full transition-colors focus:outline-none" aria-label="Toggle between IEC and ANSI standards" aria-pressed="false">IEC</button>
    </div>
  </div>

  <!-- Controls -->
  <div class="bg-gray-900 rounded-xl p-3 mb-4 flex flex-wrap gap-2 items-center">
    <div>
      <label class="text-xs text-gray-500 mr-1" for="categoryFilter">Category:</label>
      <select id="categoryFilter" onchange="buildDeck(); showCard()" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs focus:outline-none" aria-label="Filter by component category">
        <option value="all">All</option>
        <option value="Passive">Passive</option>
        <option value="Active">Active</option>
        <option value="Logic">Logic</option>
        <option value="Power">Power</option>
      </select>
    </div>
    <div>
      <label class="text-xs text-gray-500 mr-1" for="modeSelect">Mode:</label>
      <select id="modeSelect" onchange="buildDeck(); showCard()" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs focus:outline-none" aria-label="Flashcard mode">
        <option value="symbol2name">Symbol → Name</option>
        <option value="name2choice">Name → Multiple Choice</option>
      </select>
    </div>
    <button onclick="resetProgress()" class="ml-auto bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1 rounded transition-colors focus:outline-none" aria-label="Reset all progress">Reset</button>
  </div>

  <!-- Card area -->
  <div id="cardArea">
    <div class="card-container mb-4" id="cardWrapper" onclick="handleCardClick()" role="button" tabindex="0" aria-label="Flashcard" onkeydown="if(event.key==='Enter'||event.key===' ')handleCardClick()">
      <div class="card-inner" id="cardInner">
        <div class="card-front">
          <div id="cardFrontLabel" class="text-xs text-gray-500 uppercase tracking-wider mb-3"></div>
          <div id="cardFrontSymbol" class="flex items-center justify-center" style="min-height:140px"></div>
          <div id="cardFrontHint" class="text-xs text-gray-600 mt-3"></div>
        </div>
        <div class="card-back">
          <div id="cardBackLabel" class="text-xs text-gray-500 uppercase tracking-wider mb-2"></div>
          <div id="cardBackName" class="text-xl font-bold text-cyan-300 mb-1"></div>
          <div id="cardBackCategory" class="text-xs text-gray-500 mb-2"></div>
          <div id="cardBackDesc" class="text-xs text-gray-400 text-center max-w-xs"></div>
          <div id="cardBackSymbol2" class="mt-2" style="min-height:60px"></div>
        </div>
      </div>
    </div>
    <!-- Symbol→Name rating buttons -->
    <div id="ratingBtns" style="display:none">
      <div class="grid grid-cols-3 gap-3 mb-4">
        <button onclick="rate(0)" class="bg-red-950 hover:bg-red-900 border border-red-800 text-red-200 py-3 rounded-xl text-sm font-semibold transition-colors focus:outline-none" aria-label="Rate as Again">Again</button>
        <button onclick="rate(1)" class="bg-yellow-950 hover:bg-yellow-900 border border-yellow-800 text-yellow-200 py-3 rounded-xl text-sm font-semibold transition-colors focus:outline-none" aria-label="Rate as Hard">Hard</button>
        <button onclick="rate(2)" class="bg-green-950 hover:bg-green-900 border border-green-800 text-green-200 py-3 rounded-xl text-sm font-semibold transition-colors focus:outline-none" aria-label="Rate as Good">Good</button>
      </div>
    </div>
    <!-- Multiple choice buttons -->
    <div id="choiceBtns" class="grid grid-cols-2 gap-3 mb-4 hidden"></div>
  </div>

  <!-- Card counter -->
  <div class="flex items-center justify-between px-1 mb-4 text-xs text-gray-600">
    <span id="cardCounter"></span>
    <span id="cardCategory"></span>
  </div>

  <!-- Symbol reference grid -->
  <div class="bg-gray-900 rounded-xl p-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-semibold text-gray-400">Symbol Reference Gallery</h2>
      <button onclick="document.getElementById('gallery').classList.toggle('hidden')" class="text-xs text-gray-600 hover:text-gray-400 focus:outline-none" aria-label="Toggle symbol gallery">Toggle</button>
    </div>
    <div id="gallery" class="hidden grid grid-cols-3 md:grid-cols-6 gap-3"></div>
  </div>
</div>

// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
const STORAGE_KEY = 'elecFlashcardSRS_v1';
let progress = {};
let deck = [];
let deckIdx = 0;
let isFlipped = false;
let currentStandard = 'IEC';
let totalCorrect = 0, totalWrong = 0;

function loadProgress() {
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) { const p = JSON.parse(s); progress = p.progress||{}; totalCorrect=p.tc||0; totalWrong=p.tw||0; } } catch(e) {}
}
function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({progress, tc:totalCorrect, tw:totalWrong}));
}
function getState(id) { return progress[id] || {correct:0,incorrect:0,interval:1,due:Date.now(),ef:2.5}; }
function getMastered() { return COMPONENTS.filter(c=>{ const s=getState(c.id); return s.correct>=3 && s.incorrect===0; }).length; }

function toggleStandard() {
  currentStandard = currentStandard === 'IEC' ? 'ANSI' : 'IEC';
  document.getElementById('stdToggle').textContent = currentStandard;
  document.getElementById('stdToggle').setAttribute('aria-pressed', currentStandard === 'ANSI' ? 'true' : 'false');
  showCard();
}

function buildDeck() {
  const cat = document.getElementById('categoryFilter').value;
  let filtered = COMPONENTS.filter(c => cat === 'all' || c.category === cat);
  // Sort by due/difficulty
  filtered.sort((a,b) => {
    const as = getState(a.id), bs = getState(b.id);
    return as.due - bs.due;
  });
  deck = filtered;
  if (deckIdx >= deck.length) deckIdx = 0;
}

function getSvg(comp) {
  return currentStandard === 'ANSI' ? comp.svgANSI : comp.svgIEC;
}

function handleCardClick() {
  const mode = document.getElementById('modeSelect').value;
  if (mode === 'symbol2name') {
    if (!isFlipped) {
      isFlipped = true;
      document.getElementById('cardInner').classList.add('flipped');
      document.getElementById('ratingBtns').style.display = '';
    }
  }
}

function showCard() {
  if (deck.length === 0) return;
  const comp = deck[deckIdx];
  const mode = document.getElementById('modeSelect').value;

  isFlipped = false;
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('ratingBtns').style.display = 'none';
  document.getElementById('choiceBtns').classList.add('hidden');

  // Standard badge
  const stdBadge = `<span class="text-xs px-2 py-0.5 rounded bg-gray-800 text-gray-500 ml-2">${currentStandard}</span>`;

  if (mode === 'symbol2name') {
    document.getElementById('cardFrontLabel').innerHTML = `See the symbol — what is this component? ${stdBadge}`;
    document.getElementById('cardFrontSymbol').innerHTML = getSvg(comp);
    document.getElementById('cardFrontHint').textContent = `Category: ${comp.category}`;
    document.getElementById('cardBackLabel').textContent = comp.category;
    document.getElementById('cardBackName').textContent = comp.name;
    document.getElementById('cardBackCategory').textContent = comp.category;
    document.getElementById('cardBackDesc').textContent = comp.desc;
    document.getElementById('cardBackSymbol2').innerHTML = '';
  } else {
    // name → multiple choice
    document.getElementById('cardFrontLabel').innerHTML = `See the name — identify the correct symbol ${stdBadge}`;
    document.getElementById('cardFrontSymbol').innerHTML = `<div class="text-xl font-bold text-cyan-300 text-center">${comp.name}</div><div class="text-xs text-gray-500 mt-1">${comp.category} · ${comp.desc.slice(0,60)}...</div>`;
    document.getElementById('cardFrontHint').textContent = 'Select the matching symbol below';
    document.getElementById('cardBackLabel').textContent = '';
    document.getElementById('cardBackName').textContent = comp.name;
    document.getElementById('cardBackCategory').textContent = comp.category;
    document.getElementById('cardBackDesc').textContent = comp.desc;
    document.getElementById('cardBackSymbol2').innerHTML = getSvg(comp);

    // Build choices
    const others = deck.filter(c => c.id !== comp.id);
    const shuffled = [...others].sort(() => Math.random()-0.5).slice(0,3);
    const choices = [...shuffled, comp].sort(() => Math.random()-0.5);
    const choiceDiv = document.getElementById('choiceBtns');
    choiceDiv.classList.remove('hidden');
    choiceDiv.innerHTML = choices.map(c => `
      <button class="choice-btn bg-gray-900 border border-gray-700 rounded-xl p-3 flex items-center justify-center hover:border-cyan-500 transition-colors focus:outline-none"
        onclick="handleChoice(this, '${c.id}', '${comp.id}')"
        aria-label="Choice: ${c.name}">
        ${getSvg(c)}
      </button>
    `).join('');
  }

  document.getElementById('cardCounter').textContent = `${deckIdx + 1} / ${deck.length}`;
  document.getElementById('cardCategory').textContent = comp.category;
  updateStatsDisplay();
}

function handleChoice(btn, chosen, correct) {
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => { b.onclick = null; b.style.opacity = '0.6'; });

  if (chosen === correct) {
    btn.classList.add('correct');
    btn.style.opacity = '1';
    updateRating(correct, 2);
    setTimeout(() => { deckIdx = (deckIdx + 1) % deck.length; showCard(); }, 900);
  } else {
    btn.classList.add('wrong');
    btn.style.opacity = '1';
    // Show correct
    btns.forEach(b => {
      if (b.getAttribute('onclick') || true) {
        const cid = b.getAttribute('onclick');
      }
    });
    // Find correct button
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.innerHTML.includes(`id="${correct}"`)) b.classList.add('correct'), b.style.opacity = '1';
    });
    updateRating(correct, 0);
    setTimeout(() => { deckIdx = (deckIdx + 1) % deck.length; showCard(); }, 1400);
  }
}

function rate(score) {
  if (deck.length === 0) return;
  const comp = deck[deckIdx];
  updateRating(comp.id, score);
  deckIdx = (deckIdx + 1) % deck.length;
  showCard();
}

function updateRating(id, score) {
  const s = getState(id);
  if (score === 2) { s.correct++; s.interval = Math.round(s.interval * s.ef); s.ef = Math.min(3, s.ef + 0.1); totalCorrect++; }
  else if (score === 1) { s.interval = Math.max(1, Math.round(s.interval * 0.8)); s.ef = Math.max(1.3, s.ef - 0.05); }
  else { s.incorrect++; s.interval = 1; s.ef = Math.max(1.3, s.ef - 0.2); totalWrong++; }
  s.due = Date.now() + s.interval * 86400000;
  progress[id] = s;
  saveProgress();
}

function updateStatsDisplay() {
  document.getElementById('statCorrect').textContent = totalCorrect;
  document.getElementById('statWrong').textContent = totalWrong;
  document.getElementById('statMastered').textContent = getMastered();
}

function resetProgress() {
  if (!confirm('Reset all progress?')) return;
  progress = {}; totalCorrect = 0; totalWrong = 0;
  saveProgress();
  buildDeck();
  deckIdx = 0;
  showCard();
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = COMPONENTS.map(comp => `
    <div class="bg-gray-800 rounded-lg p-2 text-center hover:bg-gray-700 transition-colors cursor-pointer" onclick="jumpTo('${comp.id}')" title="${comp.name}" aria-label="Jump to ${comp.name}">
      <div class="flex items-center justify-center mb-1" style="min-height:50px">${getSvg(comp).replace(/width="\d+"/,'width="60"').replace(/height="\d+"/,'height="50"').replace(/viewBox="[^"]+"/,s=>s)}</div>
      <div class="text-xs text-gray-400 leading-tight truncate">${comp.name}</div>
      <div class="text-xs text-gray-600">${comp.category}</div>
    </div>
  `).join('');
}

function jumpTo(id) {
  const idx = deck.findIndex(c => c.id === id);
  if (idx >= 0) { deckIdx = idx; showCard(); }
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const mode = document.getElementById('modeSelect').value;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); handleCardClick(); }
  if (mode === 'symbol2name' && isFlipped) {
    if (e.key === '1') rate(0);
    if (e.key === '2') rate(1);
    if (e.key === '3') rate(2);
  }
});

// Init
loadProgress();
buildDeck();
showCard();
renderGallery();
</script>
